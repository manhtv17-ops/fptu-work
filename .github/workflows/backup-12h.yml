name: FPTU Work Backup 12h

on:
  workflow_dispatch:
  schedule:
    # Vietnam time (UTC+7): 12:00 and 00:00 daily
    - cron: '0 5,17 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Ho_Chi_Minh
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_REMOTE: gdrive:FPTU MKT Work Backup

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_DB_URL" ] || { echo "Missing SUPABASE_DB_URL"; exit 1; }
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || { echo "Missing NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Prepare backup folder
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          STAMP=$(date '+%Y-%m-%d_%H-%M-%S')
          DAY=$(date '+%Y-%m-%d')
          ROOT="backup/$STAMP"
          mkdir -p "$ROOT/database" "$ROOT/storage"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Backup database roles
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "${{ steps.meta.outputs.root }}/database/roles.sql" --role-only

      - name: Backup database schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "${{ steps.meta.outputs.root }}/database/schema.sql"

      - name: Backup database data
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "${{ steps.meta.outputs.root }}/database/data.sql" --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

      - name: Backup Supabase Storage objects
        shell: bash
        env:
          BACKUP_STORAGE_DIR: ${{ steps.meta.outputs.root }}/storage
        run: |
          set -euo pipefail
          node scripts/backup-storage.mjs

      - name: Create manifest and archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.meta.outputs.root }}"
          STAMP="${{ steps.meta.outputs.stamp }}"
          cat > "$ROOT/backup-manifest.txt" <<EOF
FPTU MKT Work Backup
Timestamp: $STAMP
Runner timezone: Asia/Ho_Chi_Minh
Source repository: $GITHUB_REPOSITORY
Commit: $GITHUB_SHA
Includes: database roles, schema, data, Supabase Storage objects
EOF
          tar -czf "backup/fptu-work-$STAMP.tar.gz" -C backup "$STAMP"
          sha256sum "backup/fptu-work-$STAMP.tar.gz" > "backup/fptu-work-$STAMP.sha256"

      - name: Upload backup to GitHub Artifacts (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: fptu-work-${{ steps.meta.outputs.stamp }}
          path: |
            backup/fptu-work-*.tar.gz
            backup/fptu-work-*.sha256
          retention-days: 30

      - name: Setup and upload to Google Drive
        shell: bash
        env:
          GDRIVE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$GDRIVE_CONF" ]; then
            echo "Google Drive secret not provided, skipping upload."
            exit 0
          fi

          echo "Installing rclone binary..."
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -qo /tmp/rclone.zip -d /tmp/rclone-dir
          sudo mv /tmp/rclone-dir/*/rclone /usr/local/bin/rclone
          sudo chmod +x /usr/local/bin/rclone
          rclone version

          CONF_DIR="$HOME/.config/rclone"
          mkdir -p "$CONF_DIR"
          echo "$GDRIVE_CONF" > "$CONF_DIR/rclone.conf"
          if ! grep -q '\[gdrive\]' "$CONF_DIR/rclone.conf"; then
            printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$GDRIVE_CONF" > "$CONF_DIR/rclone.conf"
          fi
          chmod 600 "$CONF_DIR/rclone.conf"

          echo "Available remotes:"
          rclone --config "$CONF_DIR/rclone.conf" listremotes

          STAMP="${{ steps.meta.outputs.stamp }}"
          DAY="${{ steps.meta.outputs.day }}"
          DEST="$BACKUP_REMOTE/$DAY"

          echo "Uploading to Google Drive: $DEST"
          rclone --config "$CONF_DIR/rclone.conf" copy "backup/fptu-work-$STAMP.tar.gz" "$DEST" --checksum --transfers 2 --checkers 4
          rclone --config "$CONF_DIR/rclone.conf" copy "backup/fptu-work-$STAMP.sha256" "$DEST" --checksum
          echo "Uploaded to $DEST successfully!"

          echo "Verifying upload..."
          rclone --config "$CONF_DIR/rclone.conf" lsf "$DEST" | grep -F "fptu-work-$STAMP.tar.gz" || true
          rclone --config "$CONF_DIR/rclone.conf" lsf "$DEST" | grep -F "fptu-work-$STAMP.sha256" || true

          echo "Retention cleanup - keeping 30 days..."
          rclone --config "$CONF_DIR/rclone.conf" delete "$BACKUP_REMOTE" --min-age 30d --include '*.tar.gz' --include '*.sha256' || true
          rclone --config "$CONF_DIR/rclone.conf" rmdirs "$BACKUP_REMOTE" --leave-root || true

      - name: Cleanup runner
        if: always()
        shell: bash
        run: rm -rf backup "$HOME/.config/rclone/rclone.conf"
